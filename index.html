<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>FLIBBER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫨</text></svg>" />
<meta name="description" content="Hvor langt klarer du å flibbe?" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="spill"></canvas>

  <div id="hud" class="hidden">
    <div id="distanse">0 m</div>
    <div id="kaosmeter">
      <span id="kaosLabel">KAOS x1.0</span>
      <div id="kaosBar"><div id="kaosFyll"></div></div>
    </div>
  </div>

  <div id="startskjerm" class="skjerm">
    <h1>FLIBBER</h1>
    <p class="tagline">Hvor langt klarer du å flibbe?</p>
    <button id="startKnapp" class="flibbknapp">FLIBB</button>
    <p class="hint">Trykk / mellomrom for å flibbe. Jo villere du spretter, jo høyere kaos-multiplikator.</p>
    <p class="dagens-info" id="dagensBeste"></p>
  </div>

  <div id="doedsskjerm" class="skjerm hidden">
    <h2 id="doedsmelding">Du flibbet for nær sola.</h2>
    <div class="stats">
      <div><span id="sluttDistanse">0</span> m</div>
      <div>Kaos x<span id="sluttKaos">1.0</span></div>
      <div class="poeng"><span id="sluttPoeng">0</span> poeng</div>
    </div>
    <p class="dagens-info" id="nyRekordTekst"></p>
    <button id="proveIgjenKnapp" class="flibbknapp">FLIBB IGJEN</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
